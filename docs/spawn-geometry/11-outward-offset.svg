  <text x="378" y="204" text-anchor="middle" fill="#ffe08a" font-size="13">+ 1 × radius</text><text x="616" y="204" text-anchor="middle" fill="#ffe08a" font-size="13">+ 1 × radius</text><text x="180" y="226" text-anchor="middle" fill="#e8fbff" font-size="16" font-weight="700">PARENT</text></g>

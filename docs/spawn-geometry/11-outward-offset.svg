  <g font-family="system-ui,sans-serif"><circle cx="180" cy="221" r="98" fill="#203f62" stroke="#63e6ff" stroke-width="3"/><circle cx="278" cy="221" r="36" fill="#432954" stroke="#ff72d0" stroke-width="3"/><circle cx="479" cy="221" r="36" fill="#432954" stroke="#ff72d0" stroke-width="3"/><circle cx="752" cy="221" r="36" fill="#432954" stroke="#ff72d0" stroke-width="3"/>

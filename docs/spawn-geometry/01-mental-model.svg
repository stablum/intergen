<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Intergen spawn transform mental model</title>
  <desc id="desc">A parent cube, selected attachment, local frame, twist, position offset, outward offset, and final child.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#17122b"/></linearGradient>
    <linearGradient id="cube" x2="0" y2="1"><stop stop-color="#69e8ff"/><stop offset="1" stop-color="#2976b8"/></linearGradient>
    <linearGradient id="child" x2="0" y2="1"><stop stop-color="#ff80d5"/><stop offset="1" stop-color="#8f3ec2"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#ffe08a"/></marker>
    <marker id="cyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#62e6ff"/></marker>
    <marker id="pink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#ff6fcf"/></marker>
  </defs>
  <rect width="960" height="420" rx="22" fill="url(#bg)"/>
  <text x="36" y="42" fill="#f7f5ff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">How one child transform is built</text>
  <text x="36" y="70" fill="#aab5d6" font-family="system-ui,sans-serif" font-size="14">attachment anchor → indexed twist → local position offset → child-radius outward offset</text>
  <g stroke="#9ff0ff" stroke-width="2">
    <polygon points="92,205 190,153 282,202 183,257" fill="url(#cube)"/>
    <polygon points="92,205 183,257 183,351 92,298" fill="#245a91"/>
    <polygon points="183,257 282,202 282,296 183,351" fill="#183f72"/>
  </g>
  <circle cx="282" cy="202" r="8" fill="#ffe08a" stroke="#fff3c2" stroke-width="3"/>
  <text x="88" y="382" fill="#dce6ff" font-family="system-ui,sans-serif" font-size="16" font-weight="700">PARENT</text>
  <text x="248" y="181" fill="#ffe08a" font-family="system-ui,sans-serif" font-size="13">anchor</text>
  <line x1="282" y1="202" x2="418" y2="130" stroke="#62e6ff" stroke-width="4" marker-end="url(#cyan)"/>
  <text x="334" y="130" fill="#62e6ff" font-family="system-ui,sans-serif" font-size="14" font-weight="700">X radial / outward</text>
  <line x1="282" y1="202" x2="374" y2="248" stroke="#ff6fcf" stroke-width="4" marker-end="url(#pink)"/>
  <text x="336" y="270" fill="#ff9ade" font-family="system-ui,sans-serif" font-size="14">Y tangent</text>
  <line x1="282" y1="202" x2="277" y2="104" stroke="#8dffb3" stroke-width="4" marker-end="url(#cyan)"/>
  <text x="208" y="102" fill="#8dffb3" font-family="system-ui,sans-serif" font-size="14">Z bitangent</text>
  <path d="M325 183 C350 188 360 207 351 229" fill="none" stroke="#ffe08a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="350" y="188" fill="#ffe08a" font-family="system-ui,sans-serif" font-size="13">twist</text>
  <path d="M398 164 L523 106" stroke="#ff6fcf" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#pink)"/>
  <text x="418" y="94" fill="#ff9ade" font-family="system-ui,sans-serif" font-size="13">local position offset</text>
  <path d="M523 106 L690 42" stroke="#ffe08a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="568" y="120" fill="#ffe08a" font-family="system-ui,sans-serif" font-size="13">outward = radius × ratio</text>
  <g transform="translate(676 66) rotate(-8)" stroke="#ffc6eb" stroke-width="2">
    <polygon points="0,86 75,45 145,80 70,123" fill="url(#child)"/>
    <polygon points="0,86 70,123 70,192 0,154" fill="#783598"/>
    <polygon points="70,123 145,80 145,149 70,192" fill="#55257c"/>
  </g>
  <text x="723" y="285" fill="#ffd7f1" font-family="system-ui,sans-serif" font-size="16" font-weight="700">FINAL CHILD</text>
  <rect x="520" y="312" width="400" height="72" rx="12" fill="#111a31" stroke="#37466d"/>
  <text x="540" y="338" fill="#f7f5ff" font-family="ui-monospace,monospace" font-size="14">child scale = parent scale × scale ratio</text>
  <text x="540" y="364" fill="#aab5d6" font-family="ui-monospace,monospace" font-size="14">mesh scale  = child scale × [axis x, y, z]</text>
</svg>

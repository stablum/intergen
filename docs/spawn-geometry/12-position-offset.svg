<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Local child position offset frame</title>
  <desc id="desc">A parent cube establishes radial X, tangent Y, and bitangent Z at its attachment. A second panel shows a ghost 3D child at the anchor and a solid 3D child shifted by the vector sum of positive X and positive Y.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#17122b"/></linearGradient>
    <linearGradient id="parent" x2="0" y2="1"><stop stop-color="#72ecff"/><stop offset="1" stop-color="#3477bb"/></linearGradient>
    <linearGradient id="child" x2="0" y2="1"><stop stop-color="#ff8bd8"/><stop offset="1" stop-color="#8b3eb2"/></linearGradient>
    <marker id="cyan" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#63e6ff"/></marker>
    <marker id="pink" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#ff72d0"/></marker>
    <marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#8dffb3"/></marker>
    <marker id="yellow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#ffe08a"/></marker>
  </defs>
  <rect width="960" height="430" rx="22" fill="url(#bg)"/>
  <text x="36" y="43" fill="#f7f5ff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">F2 pos x / y / z — attachment-local translation</text>
  <text x="36" y="69" fill="#aab5d6" font-family="system-ui,sans-serif" font-size="14">These axes belong to the spawn frame, not to world X/Y/Z</text>

  <g stroke="#a5f4ff" stroke-width="2"><polygon points="70,240 195,174 313,233 187,303" fill="url(#parent)"/><polygon points="70,240 187,303 187,389 70,326" fill="#234e85"/><polygon points="187,303 313,233 313,319 187,389" fill="#173863"/></g>
  <circle cx="313" cy="233" r="8" fill="#ffe08a"/>
  <line x1="313" y1="233" x2="464" y2="153" stroke="#63e6ff" stroke-width="4" marker-end="url(#cyan)"/><line x1="313" y1="233" x2="446" y2="300" stroke="#ff72d0" stroke-width="4" marker-end="url(#pink)"/><line x1="313" y1="233" x2="307" y2="112" stroke="#8dffb3" stroke-width="4" marker-end="url(#green)"/>
  <g font-family="system-ui,sans-serif" font-size="14" font-weight="700"><text x="418" y="146" fill="#63e6ff">+X · RADIAL</text><text x="408" y="321" fill="#ff8bd8">+Y · TANGENT</text><text x="217" y="113" fill="#8dffb3">+Z · BITANGENT</text></g>

  <rect x="535" y="92" width="390" height="287" rx="18" fill="#111a31" stroke="#37466d"/>
  <text x="730" y="123" text-anchor="middle" fill="#ff8bd8" font-family="system-ui,sans-serif" font-size="16" font-weight="700">EXAMPLE: [+0.25, +0.35, 0]</text>
  <g fill="none" stroke="#7180a8" stroke-width="2" stroke-dasharray="7 5"><polygon points="590,218 632,196 673,217 631,240"/><polygon points="590,218 631,240 631,278 590,256"/><polygon points="631,240 673,217 673,255 631,278"/></g>
  <circle cx="631" cy="238" r="5" fill="#7180a8"/>
  <line x1="639" y1="238" x2="796" y2="238" stroke="#ffe08a" stroke-width="4" marker-end="url(#yellow)"/>
  <text x="713" y="178" text-anchor="middle" fill="#ffe08a" font-family="system-ui,sans-serif" font-size="13">+X radial + +Y tangent</text>
  <g stroke="#ffc7eb" stroke-width="2"><polygon points="755,218 797,196 838,217 796,240" fill="url(#child)"/><polygon points="755,218 796,240 796,278 755,256" fill="#73338e"/><polygon points="796,240 838,217 838,255 796,278" fill="#51266f"/></g>
  <circle cx="796" cy="238" r="5" fill="#ffe08a"/>
  <text x="631" y="303" text-anchor="middle" fill="#aab5d6" font-family="system-ui,sans-serif" font-size="12">at attachment anchor</text><text x="796" y="303" text-anchor="middle" fill="#dce6ff" font-family="system-ui,sans-serif" font-size="12">offset child</text>
  <text x="730" y="346" text-anchor="middle" fill="#aab5d6" font-family="system-ui,sans-serif" font-size="13">each component × parent projected span on that axis</text>
  <rect x="204" y="397" width="552" height="24" rx="7" fill="#111a31" stroke="#37466d"/>
  <text x="480" y="414" text-anchor="middle" fill="#dce6ff" font-family="system-ui,sans-serif" font-size="12">The evaluated vector is copied into each newly spawned node.</text>
</svg>

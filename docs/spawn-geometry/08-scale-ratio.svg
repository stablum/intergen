<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Inherited uniform scale ratio</title><desc id="desc">A recursive chain shrinks with ratio one half and a before-after comparison shows minus and plus.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#17122b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#ffe08a"/></marker></defs><rect width="960" height="390" rx="22" fill="url(#bg)"/><text x="36" y="44" fill="#f7f5ff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">− / + — uniform scale is inherited recursively</text>
  <g font-family="system-ui,sans-serif"><text x="58" y="91" fill="#63e6ff" font-size="16" font-weight="700">EXAMPLE: RATIO 0.5</text>
    <g stroke-width="2"><g transform="translate(55 45)" stroke="#a5f4ff"><polygon points="35,178 104,141 170,175 100,214" fill="#3d9bd0"/><polygon points="35,178 100,214 100,282 35,246" fill="#234e85"/><polygon points="100,214 170,175 170,243 100,282" fill="#173863"/></g><g transform="translate(260 103) scale(.68)" stroke="#ffc7eb"><polygon points="35,178 104,141 170,175 100,214" fill="#c552b5"/><polygon points="35,178 100,214 100,282 35,246" fill="#73338e"/><polygon points="100,214 170,175 170,243 100,282" fill="#51266f"/></g><g transform="translate(405 142) scale(.46)" stroke="#d4ffe2"><polygon points="35,178 104,141 170,175 100,214" fill="#4ec48c"/><polygon points="35,178 100,214 100,282 35,246" fill="#28725d"/><polygon points="100,214 170,175 170,243 100,282" fill="#18594f"/></g></g>
    <path d="M226 233H282" stroke="#ffe08a" stroke-width="4" marker-end="url(#a)"/><path d="M379 238H429" stroke="#ffe08a" stroke-width="4" marker-end="url(#a)"/><text x="113" y="348" fill="#dce6ff" font-size="14">level 0 · 2.0</text><text x="294" y="348" fill="#dce6ff" font-size="14">level 1 · 1.0</text><text x="437" y="348" fill="#dce6ff" font-size="14">level 2 · 0.5</text>
    <rect x="550" y="91" width="370" height="244" rx="16" fill="#111a31" stroke="#37466d"/><text x="735" y="124" text-anchor="middle" fill="#ff8bd8" font-size="16" font-weight="700">FUTURE SPAWNS ONLY</text>
    <circle cx="634" cy="210" r="55" fill="#203f62" stroke="#63e6ff" stroke-width="3"/><circle cx="823" cy="210" r="27" fill="#432954" stroke="#ff72d0" stroke-width="3"/><path d="M696 210H783" stroke="#ffe08a" stroke-width="4" marker-end="url(#a)"/><text x="634" y="215" text-anchor="middle" fill="#e8fbff" font-size="17">parent</text><text x="823" y="215" text-anchor="middle" fill="#ffe1f5" font-size="13">child</text><text x="735" y="294" text-anchor="middle" fill="#dce6ff" font-size="14">child = parent × ratio</text>
  </g>
</svg>

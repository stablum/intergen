<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Spawn search and rejection rules</title><desc id="desc">Breadth-first traversal passes candidates through occupied, exclusion, and containment filters.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#17122b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#ffe08a"/></marker></defs><rect width="960" height="430" rx="22" fill="url(#bg)"/><text x="36" y="44" fill="#f7f5ff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">How Intergen finds the next valid attachment</text>
  <g font-family="system-ui,sans-serif"><rect x="32" y="82" width="300" height="310" rx="16" fill="#111a31" stroke="#37466d"/><text x="52" y="113" fill="#63e6ff" font-size="15" font-weight="700">BREADTH-FIRST SEARCH</text><g stroke="#63749a" stroke-width="3"><path d="M180 166L100 225M180 166L180 225M180 166L260 225M100 225L70 289M100 225L130 289"/></g><g fill="#203f62" stroke="#63e6ff" stroke-width="2"><circle cx="180" cy="153" r="35"/><circle cx="100" cy="225" r="25"/><circle cx="180" cy="225" r="25"/><circle cx="260" cy="225" r="25"/></g><g fill="#432954" stroke="#ff72d0" stroke-width="2"><circle cx="70" cy="289" r="18"/><circle cx="130" cy="289" r="18"/></g><g fill="#f7f5ff" font-size="13" text-anchor="middle"><text x="180" y="158">1</text><text x="100" y="230">2</text><text x="180" y="230">3</text><text x="260" y="230">4</text><text x="70" y="294">5</text><text x="130" y="294">6</text></g><text x="52" y="343" fill="#dce6ff" font-size="13">level → parent creation order</text><text x="52" y="365" fill="#aab5d6" font-size="13">→ attachment index</text>
  <path d="M344 237H400" stroke="#ffe08a" stroke-width="4" marker-end="url(#a)"/><g text-anchor="middle"><rect x="412" y="86" width="205" height="62" rx="12" fill="#432954" stroke="#ff72d0"/><text x="514" y="111" fill="#ffe1f5" font-size="14" font-weight="700">OCCUPIED?</text><text x="514" y="132" fill="#aab5d6" font-size="12">already used source</text><rect x="412" y="171" width="205" height="62" rx="12" fill="#4b3c22" stroke="#ffe08a"/><text x="514" y="196" fill="#fff1bc" font-size="14" font-weight="700">EXCLUDED?</text><text x="514" y="217" fill="#aab5d6" font-size="12">stable probability filter</text><rect x="412" y="256" width="205" height="76" rx="12" fill="#203f62" stroke="#63e6ff"/><text x="514" y="281" fill="#e8fbff" font-size="14" font-weight="700">CONTAINED?</text><text x="514" y="302" fill="#aab5d6" font-size="12">inside existing—or contains it</text></g><path d="M628 209H690" stroke="#ffe08a" stroke-width="4" marker-end="url(#a)"/>
  <rect x="705" y="143" width="220" height="184" rx="16" fill="#283f30" stroke="#8dffb3" stroke-width="3"/><text x="815" y="181" text-anchor="middle" fill="#dcffe8" font-size="16" font-weight="700">FIRST VALID CANDIDATE</text><circle cx="785" cy="247" r="48" fill="#203f62" stroke="#63e6ff" stroke-width="2"/><circle cx="860" cy="216" r="26" fill="#432954" stroke="#ff72d0" stroke-width="2"/><circle cx="833" cy="227" r="6" fill="#ffe08a"/><text x="815" y="304" text-anchor="middle" fill="#dce6ff" font-size="13">spawn + mark source occupied</text></g>
</svg>

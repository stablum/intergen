<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Reset the scene to the selected shape</title><desc id="desc">A multi-level tree is removed by R and replaced with the selected octahedron root while settings remain.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#17122b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#ffe08a"/></marker></defs><rect width="960" height="400" rx="22" fill="url(#bg)"/><text x="36" y="44" fill="#f7f5ff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">R — delete the tree and make the selected shape the root</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle"><text x="240" y="92" fill="#63e6ff" font-size="16" font-weight="700">BEFORE: LEVELS 0–2</text><g stroke="#63749a" stroke-width="3"><path d="M240 186L138 258M240 186L240 270M240 186L342 258M138 258L103 323M138 258L174 323M342 258L306 323M342 258L378 323"/></g><g fill="#203f62" stroke="#63e6ff" stroke-width="3"><circle cx="240" cy="168" r="48"/><circle cx="138" cy="258" r="32"/><circle cx="240" cy="270" r="32"/><circle cx="342" cy="258" r="32"/></g><g fill="#432954" stroke="#ff72d0" stroke-width="2"><circle cx="103" cy="323" r="20"/><circle cx="174" cy="323" r="20"/><circle cx="306" cy="323" r="20"/><circle cx="378" cy="323" r="20"/></g>
  <rect x="445" y="168" width="72" height="62" rx="11" fill="#4b3c22" stroke="#ffe08a" stroke-width="2"/><text x="481" y="207" fill="#fff1bc" font-size="24" font-weight="700">R</text><path d="M528 199H607" stroke="#ffe08a" stroke-width="5" marker-end="url(#a)"/>
  <text x="732" y="92" fill="#ff8bd8" font-size="16" font-weight="700">AFTER: NEW LEVEL 0</text><g stroke="#ffc7eb" stroke-width="3"><polygon points="732,135 680,218 732,247" fill="#c552b5"/><polygon points="732,135 785,216 732,247" fill="#873eab"/><polygon points="680,218 732,247 732,303" fill="#71358e"/><polygon points="785,216 732,247 732,303" fill="#51266f"/></g><text x="732" y="378" fill="#dce6ff" font-size="14">selected shape = octahedron</text>
  <rect x="615" y="315" width="295" height="38" rx="9" fill="#111a31" stroke="#37466d"/><text x="762" y="339" fill="#aab5d6" font-size="12">settings stay · cursor and descendants clear</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">F2 generation editing workflow</title><desc id="desc">A four-step flow from F2 groups to scene rows, fields, and exact or stepped editing.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#17122b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#ffe08a"/></marker></defs>
  <rect width="960" height="380" rx="22" fill="url(#bg)"/>
  <text x="36" y="44" fill="#f7f5ff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">F2: precise geometry editing</text>
  <g font-family="system-ui,sans-serif">
    <g fill="#111a31" stroke="#44547d" stroke-width="2"><rect x="38" y="92" width="190" height="210" rx="16"/><rect x="270" y="92" width="190" height="210" rx="16"/><rect x="502" y="92" width="190" height="210" rx="16"/><rect x="734" y="92" width="190" height="210" rx="16"/></g>
    <g fill="#63e6ff" font-size="14" font-weight="700"><text x="58" y="120">1 · OPEN GROUPS</text><text x="290" y="120">2 · CHOOSE SCENE</text><text x="522" y="120">3 · CHOOSE FIELD</text><text x="754" y="120">4 · CHANGE VALUE</text></g>
    <rect x="85" y="151" width="96" height="54" rx="10" fill="#203f62" stroke="#63e6ff" stroke-width="2"/><text x="133" y="184" text-anchor="middle" fill="#e8fbff" font-size="21" font-weight="700">F2</text>
    <text x="58" y="237" fill="#dce6ff" font-size="14">Up / Down</text><text x="58" y="259" fill="#aab5d6" font-size="13">select group</text>
    <g font-size="13"><rect x="294" y="143" width="142" height="30" rx="7" fill="#27324f"/><text x="310" y="163" fill="#9aa8cc">fx · camera</text><rect x="294" y="180" width="142" height="36" rx="7" fill="#432954" stroke="#ff72d0"/><text x="310" y="203" fill="#ffe1f5" font-weight="700">scene</text><rect x="294" y="223" width="142" height="30" rx="7" fill="#27324f"/><text x="310" y="243" fill="#9aa8cc">mat · stage</text></g>
    <text x="290" y="280" fill="#dce6ff" font-size="13">Enter / Space opens</text>
    <g font-size="12"><text x="522" y="153" fill="#aab5d6">VALUE</text><text x="584" y="153" fill="#aab5d6">AMP</text><text x="626" y="153" fill="#aab5d6">HZ</text><rect x="520" y="164" width="152" height="37" rx="8" fill="#203f62" stroke="#63e6ff"/><text x="532" y="188" fill="#e8fbff">twist</text><rect x="579" y="170" width="36" height="25" rx="5" fill="#432954"/><rect x="620" y="170" width="36" height="25" rx="5" fill="#283f30"/><text x="522" y="228" fill="#dce6ff">← / → or Tab</text><text x="522" y="250" fill="#aab5d6">moves active field</text><text x="522" y="276" fill="#ff8bd8">L toggles LFO</text></g>
    <g font-size="13"><rect x="754" y="142" width="148" height="38" rx="8" fill="#203f62"/><text x="828" y="166" fill="#e8fbff" text-anchor="middle">Ctrl + ↑ / ↓</text><rect x="754" y="190" width="68" height="34" rx="8" fill="#432954"/><text x="788" y="212" fill="#ffe1f5" text-anchor="middle">Shift</text><rect x="834" y="190" width="68" height="34" rx="8" fill="#283f30"/><text x="868" y="212" fill="#dcffe8" text-anchor="middle">Alt</text><text x="754" y="250" fill="#dce6ff">or type 0.157</text><text x="754" y="274" fill="#ffe08a">Enter confirms</text></g>
    <path d="M234 194H258" stroke="#ffe08a" stroke-width="3" marker-end="url(#a)"/><path d="M466 194H490" stroke="#ffe08a" stroke-width="3" marker-end="url(#a)"/><path d="M698 194H722" stroke="#ffe08a" stroke-width="3" marker-end="url(#a)"/>
  </g>
  <text x="480" y="344" text-anchor="middle" fill="#aab5d6" font-family="system-ui,sans-serif" font-size="14">Enter with no typed value resets one field · Shift + Enter resets all F2 fields</text>
</svg>

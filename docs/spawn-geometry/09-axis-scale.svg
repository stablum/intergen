<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Per-axis child scale</title><desc id="desc">Four isometric cubes show neutral and independently stretched X, Y, and Z local mesh axes.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#17122b"/></linearGradient></defs><rect width="960" height="390" rx="22" fill="url(#bg)"/><text x="36" y="44" fill="#f7f5ff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">F2 axis x / y / z — stretch the child mesh locally</text><text x="36" y="70" fill="#aab5d6" font-family="system-ui,sans-serif" font-size="14">These values are copied into new nodes; [1, 1, 1] is neutral</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle" stroke-width="2"><g transform="translate(45 10)" stroke="#a5f4ff"><polygon points="28,189 95,153 160,186 92,224" fill="#3d9bd0"/><polygon points="28,189 92,224 92,286 28,251" fill="#234e85"/><polygon points="92,224 160,186 160,248 92,286" fill="#173863"/></g><text x="137" y="330" fill="#dce6ff" font-size="15">[1, 1, 1]</text><text x="137" y="352" fill="#aab5d6" font-size="13">neutral</text>
    <g transform="translate(253 10)" stroke="#ffc7eb"><polygon points="10,189 95,143 180,186 92,235" fill="#c552b5"/><polygon points="10,189 92,235 92,286 10,241" fill="#73338e"/><polygon points="92,235 180,186 180,237 92,286" fill="#51266f"/></g><text x="345" y="330" fill="#ff8bd8" font-size="15">axis X ↑</text><text x="345" y="352" fill="#aab5d6" font-size="13">local width</text>
    <g transform="translate(478 10)" stroke="#d4ffe2"><polygon points="28,189 95,153 160,186 92,224" fill="#4ec48c"/><polygon points="28,189 92,224 92,306 28,271" fill="#28725d"/><polygon points="92,224 160,186 160,268 92,306" fill="#18594f"/></g><text x="570" y="330" fill="#8dffb3" font-size="15">axis Y ↑</text><text x="570" y="352" fill="#aab5d6" font-size="13">local height</text>
    <g transform="translate(703 10)" stroke="#fff0ba"><polygon points="18,189 95,148 173,187 92,232" fill="#d3a34a"/><polygon points="18,189 92,232 92,286 18,245" fill="#8d632e"/><polygon points="92,232 173,187 173,241 92,286" fill="#664522"/></g><path d="M762 170L835 131" stroke="#ffe08a" stroke-width="5"/><text x="795" y="330" fill="#ffe08a" font-size="15">axis Z ↑</text><text x="795" y="352" fill="#aab5d6" font-size="13">local depth</text>
  </g>
</svg>

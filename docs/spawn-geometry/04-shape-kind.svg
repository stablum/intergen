<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Four selectable child shape kinds</title><desc id="desc">Isometric cube, tetrahedron, octahedron, and dodecahedron with keyboard keys and attachment counts.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Generation configuration flow</title><desc id="desc">Config defaults, bounds, and steps feed runtime base values, optional LFOs, clamps, and child node transforms.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#17122b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#ffe08a"/></marker></defs><rect width="960" height="400" rx="22" fill="url(#bg)"/><text x="36" y="44" fill="#f7f5ff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">From config.toml to a spawned node</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="34" y="94" width="186" height="230" rx="16" fill="#203f62" stroke="#63e6ff" stroke-width="2"/><text x="127" y="126" fill="#e8fbff" font-size="16" font-weight="700">[generation]</text><g fill="#aab5d6" font-family="ui-monospace,monospace" font-size="12" text-anchor="start"><text x="54" y="165">default = 0.58</text><text x="54" y="193">step = 0.05</text><text x="54" y="221">min = 0.15</text><text x="54" y="249">max = 1.0</text><text x="54" y="289">loaded at startup</text></g><path d="M230 209H281" stroke="#ffe08a" stroke-width="4" marker-end="url(#a)"/>
  <rect x="294" y="94" width="186" height="230" rx="16" fill="#432954" stroke="#ff72d0" stroke-width="2"/><text x="387" y="126" fill="#ffe1f5" font-size="16" font-weight="700">RUNTIME BASE</text><text x="387" y="171" fill="#dce6ff" font-size="13">direct keys</text><text x="387" y="199" fill="#dce6ff" font-size="13">F2 exact / steps</text><text x="387" y="227" fill="#dce6ff" font-size="13">preset load</text><rect x="324" y="260" width="126" height="35" rx="8" fill="#27324f"/><text x="387" y="283" fill="#ff8bd8" font-size="13">+ optional LFO</text><path d="M490 209H541" stroke="#ffe08a" stroke-width="4" marker-end="url(#a)"/>
  <rect x="554" y="94" width="150" height="230" rx="16" fill="#4b3c22" stroke="#ffe08a" stroke-width="2"/><text x="629" y="126" fill="#fff1bc" font-size="16" font-weight="700">CLAMP</text><text x="629" y="181" fill="#dce6ff" font-size="13">effective value</text><text x="629" y="210" fill="#aab5d6" font-size="12">stays inside</text><text x="629" y="232" fill="#aab5d6" font-size="12">safe bounds</text><path d="M714 209H765" stroke="#ffe08a" stroke-width="4" marker-end="url(#a)"/>
  <rect x="778" y="94" width="148" height="230" rx="16" fill="#283f30" stroke="#8dffb3" stroke-width="2"/><text x="852" y="126" fill="#dcffe8" font-size="16" font-weight="700">SPAWN</text><g stroke="#d4ffe2" stroke-width="2"><polygon points="810,205 853,182 894,203 851,227" fill="#4ec48c"/><polygon points="810,205 851,227 851,267 810,245" fill="#28725d"/><polygon points="851,227 894,203 894,243 851,267" fill="#18594f"/></g><text x="852" y="293" fill="#aab5d6" font-size="12">copy / apply value</text></g><text x="480" y="366" text-anchor="middle" fill="#aab5d6" font-family="system-ui,sans-serif" font-size="13">F2 edits are runtime-only; change config.toml to alter the next launch</text>
</svg>

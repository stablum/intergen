<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Single-source repeat count</title><desc id="desc">Three panels show repeat counts zero, one, and four at one parent attachment.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#17122b"/></linearGradient><linearGradient id="p" x2="0" y2="1"><stop stop-color="#6ceaff"/><stop offset="1" stop-color="#285ca0"/></linearGradient></defs><rect width="960" height="390" rx="22" fill="url(#bg)"/><text x="36" y="44" fill="#f7f5ff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">, / . — how many children reuse one source attachment?</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle"><g fill="#111a31" stroke="#37466d"><rect x="34" y="82" width="280" height="268" rx="16"/><rect x="340" y="82" width="280" height="268" rx="16"/><rect x="646" y="82" width="280" height="268" rx="16"/></g>
  <text x="174" y="116" fill="#ffe08a" font-size="18" font-weight="700">COUNT 0</text><text x="480" y="116" fill="#63e6ff" font-size="18" font-weight="700">COUNT 1</text><text x="786" y="116" fill="#ff8bd8" font-size="18" font-weight="700">COUNT 4</text>
  <g stroke="#a5f4ff" stroke-width="2"><g transform="translate(72 10)"><polygon points="40,223 104,189 164,220 100,256" fill="url(#p)"/><polygon points="40,223 100,256 100,310 40,278" fill="#234e85"/><polygon points="100,256 164,220 164,274 100,310" fill="#173863"/></g><g transform="translate(378 10)"><polygon points="40,223 104,189 164,220 100,256" fill="url(#p)"/><polygon points="40,223 100,256 100,310 40,278" fill="#234e85"/><polygon points="100,256 164,220 164,274 100,310" fill="#173863"/></g><g transform="translate(684 10)"><polygon points="40,223 104,189 164,220 100,256" fill="url(#p)"/><polygon points="40,223 100,256 100,310 40,278" fill="#234e85"/><polygon points="100,256 164,220 164,274 100,310" fill="#173863"/></g></g>
  <g fill="#ff72d0" stroke="#ffd1ef" stroke-width="2"><circle cx="245" cy="220" r="16"/><circle cx="551" cy="220" r="16"/><circle cx="857" cy="220" r="16"/><circle cx="879" cy="198" r="14"/><circle cx="897" cy="227" r="13"/><circle cx="875" cy="244" r="12"/></g>
  <circle cx="236" cy="230" r="6" fill="#ffe08a"/><circle cx="542" cy="230" r="6" fill="#ffe08a"/><circle cx="848" cy="230" r="6" fill="#ffe08a"/>
  <text x="174" y="326" fill="#dce6ff" font-size="13">never auto-advance</text><text x="480" y="326" fill="#dce6ff" font-size="13">occupy after each success</text><text x="786" y="326" fill="#dce6ff" font-size="13">occupy after four successes</text></g>
</svg>

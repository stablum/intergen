<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Single-source repeat count</title>
  <desc id="desc">Three panels show that repeated children use the exact same source attachment. Badges indicate unlimited, one, or four successful spawns; repeated children may overlap when their transforms are identical.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#17122b"/></linearGradient><linearGradient id="parent" x2="0" y2="1"><stop stop-color="#72ecff"/><stop offset="1" stop-color="#3477bb"/></linearGradient><linearGradient id="child" x2="0" y2="1"><stop stop-color="#ff8bd8"/><stop offset="1" stop-color="#8b3eb2"/></linearGradient></defs>
  <rect width="960" height="420" rx="22" fill="url(#bg)"/>
  <text x="36" y="43" fill="#f7f5ff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">, / . — successful spawns that reuse one source attachment</text>
  <text x="36" y="69" fill="#aab5d6" font-family="system-ui,sans-serif" font-size="14">The transform is shared; identical repeated children can overlap exactly</text>
  <g fill="#111a31" stroke="#37466d"><rect x="30" y="91" width="286" height="287" rx="16"/><rect x="337" y="91" width="286" height="287" rx="16"/><rect x="644" y="91" width="286" height="287" rx="16"/></g>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="173" y="122" fill="#ffe08a" font-size="17" font-weight="700">COUNT 0 · UNLIMITED</text><text x="480" y="122" fill="#63e6ff" font-size="17" font-weight="700">COUNT 1</text><text x="787" y="122" fill="#ff8bd8" font-size="17" font-weight="700">COUNT 4</text>
    <g stroke="#a5f4ff" stroke-width="2"><g transform="translate(52 20)"><polygon points="40,223 104,189 164,220 100,256" fill="url(#parent)"/><polygon points="40,223 100,256 100,310 40,278" fill="#234e85"/><polygon points="100,256 164,220 164,274 100,310" fill="#173863"/></g><g transform="translate(359 20)"><polygon points="40,223 104,189 164,220 100,256" fill="url(#parent)"/><polygon points="40,223 100,256 100,310 40,278" fill="#234e85"/><polygon points="100,256 164,220 164,274 100,310" fill="#173863"/></g><g transform="translate(666 20)"><polygon points="40,223 104,189 164,220 100,256" fill="url(#parent)"/><polygon points="40,223 100,256 100,310 40,278" fill="#234e85"/><polygon points="100,256 164,220 164,274 100,310" fill="#173863"/></g></g>
    <g stroke="#ffc7eb" stroke-width="2"><g transform="translate(184 23) scale(.68)"><polygon points="40,223 104,189 164,220 100,256" fill="url(#child)"/><polygon points="40,223 100,256 100,310 40,278" fill="#73338e"/><polygon points="100,256 164,220 164,274 100,310" fill="#51266f"/></g><g transform="translate(491 23) scale(.68)"><polygon points="40,223 104,189 164,220 100,256" fill="url(#child)"/><polygon points="40,223 100,256 100,310 40,278" fill="#73338e"/><polygon points="100,256 164,220 164,274 100,310" fill="#51266f"/></g><g transform="translate(798 23) scale(.68)"><polygon points="40,223 104,189 164,220 100,256" fill="url(#child)"/><polygon points="40,223 100,256 100,310 40,278" fill="#73338e"/><polygon points="100,256 164,220 164,274 100,310" fill="#51266f"/></g></g>
    <g><circle cx="280" cy="190" r="24" fill="#4b3c22" stroke="#ffe08a" stroke-width="2"/><text x="280" y="198" fill="#fff1bc" font-size="22" font-weight="700">×∞</text><circle cx="587" cy="190" r="24" fill="#203f62" stroke="#63e6ff" stroke-width="2"/><text x="587" y="198" fill="#e8fbff" font-size="22" font-weight="700">×1</text><circle cx="894" cy="190" r="24" fill="#432954" stroke="#ff72d0" stroke-width="2"/><text x="894" y="198" fill="#ffe1f5" font-size="22" font-weight="700">×4</text></g>
    <g stroke="#ffe08a" stroke-width="2"><line x1="216" y1="240" x2="253" y2="202"/><line x1="523" y1="240" x2="560" y2="202"/><line x1="830" y1="240" x2="867" y2="202"/></g>
    <circle cx="216" cy="240" r="6" fill="#ffe08a"/><circle cx="523" cy="240" r="6" fill="#ffe08a"/><circle cx="830" cy="240" r="6" fill="#ffe08a"/>
    <text x="173" y="342" fill="#dce6ff" font-size="13">source is never auto-occupied</text><text x="480" y="342" fill="#dce6ff" font-size="13">occupy after one success</text><text x="787" y="342" fill="#dce6ff" font-size="13">occupy after four successes</text>
    <text x="787" y="362" fill="#aab5d6" font-size="12">badge counts coincident children</text>
  </g>
  <text x="480" y="405" text-anchor="middle" fill="#aab5d6" font-family="system-ui,sans-serif" font-size="13">An active LFO can give repeated children different transforms; without one, they may be visually coincident.</text>
</svg>

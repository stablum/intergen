<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Deterministic spawn exclusion probability</title><desc id="desc">Attachment dots are all included at zero percent, deterministically sparse at fifty percent, and all excluded at one hundred percent.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#17122b"/></linearGradient></defs><rect width="960" height="390" rx="22" fill="url(#bg)"/><text x="36" y="44" fill="#f7f5ff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">V / B / N — deterministic attachment filtering</text><text x="36" y="70" fill="#aab5d6" font-family="system-ui,sans-serif" font-size="14">cyan = candidate kept · crossed magenta = candidate excluded</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle"><g fill="#111a31" stroke="#37466d"><rect x="34" y="93" width="280" height="244" rx="16"/><rect x="340" y="93" width="280" height="244" rx="16"/><rect x="646" y="93" width="280" height="244" rx="16"/></g><text x="174" y="124" fill="#63e6ff" font-size="18" font-weight="700">0%</text><text x="480" y="124" fill="#ffe08a" font-size="18" font-weight="700">50%</text><text x="786" y="124" fill="#ff8bd8" font-size="18" font-weight="700">100%</text>
  <g fill="#203f62" stroke="#63e6ff" stroke-width="2"><polygon points="112,182 174,150 236,182 174,216"/><polygon points="418,182 480,150 542,182 480,216"/><polygon points="724,182 786,150 848,182 786,216"/></g>
  <g fill="#63e6ff"><circle cx="112" cy="182" r="7"/><circle cx="174" cy="150" r="7"/><circle cx="236" cy="182" r="7"/><circle cx="174" cy="216" r="7"/><circle cx="418" cy="182" r="7"/><circle cx="480" cy="150" r="7"/></g>
  <g stroke="#ff72d0" stroke-width="4"><path d="M529 169l26 26m0-26l-26 26M467 203l26 26m0-26l-26 26"/><path d="M711 169l26 26m0-26l-26 26M773 137l26 26m0-26l-26 26M835 169l26 26m0-26l-26 26M773 203l26 26m0-26l-26 26"/></g>
  <text x="174" y="287" fill="#dce6ff" font-size="13">every attachment eligible</text><text x="480" y="287" fill="#dce6ff" font-size="13">stable sparse pattern</text><text x="786" y="287" fill="#dce6ff" font-size="13">no spawn is possible</text><text x="480" y="365" fill="#aab5d6" font-size="13">sample(parent index, attachment index, mode) &lt; probability → skip</text></g>
</svg>

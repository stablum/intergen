<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">Existing-shape reflow versus future-spawn settings</title><desc id="desc">Twist and outward offset reflow existing descendants while mesh, placement, scale, local position, and exclusion affect future children.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#17122b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#ffe08a"/></marker></defs><rect width="960" height="410" rx="22" fill="url(#bg)"/><text x="36" y="44" fill="#f7f5ff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">Two kinds of geometry setting</text>
  <g font-family="system-ui,sans-serif"><rect x="35" y="84" width="425" height="285" rx="16" fill="#111a31" stroke="#ff72d0" stroke-width="2"/><text x="247" y="118" text-anchor="middle" fill="#ff8bd8" font-size="18" font-weight="700">LIVE REFLOW</text><text x="247" y="143" text-anchor="middle" fill="#aab5d6" font-size="13">twist · outward offset</text><g stroke="#63749a" stroke-width="3"><path d="M245 209L153 289M245 209L335 289"/></g><g fill="#203f62" stroke="#63e6ff" stroke-width="2"><circle cx="245" cy="198" r="43"/></g><g fill="#432954" stroke="#ff72d0" stroke-width="2"><rect x="121" y="257" width="64" height="64" transform="rotate(-18 153 289)"/><rect x="303" y="257" width="64" height="64" transform="rotate(25 335 289)"/></g><path d="M168 245Q244 169 318 245" fill="none" stroke="#ffe08a" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="247" y="348" text-anchor="middle" fill="#dce6ff" font-size="13">existing centers / rotations recompute</text>
  <rect x="500" y="84" width="425" height="285" rx="16" fill="#111a31" stroke="#63e6ff" stroke-width="2"/><text x="712" y="118" text-anchor="middle" fill="#63e6ff" font-size="18" font-weight="700">FUTURE SPAWNS ONLY</text><text x="712" y="143" text-anchor="middle" fill="#aab5d6" font-size="13">shape · placement · scale · local position · exclusion</text><circle cx="625" cy="233" r="55" fill="#203f62" stroke="#63e6ff" stroke-width="3"/><path d="M689 233H749" stroke="#ffe08a" stroke-width="4" marker-end="url(#a)"/><rect x="769" y="193" width="80" height="80" rx="8" fill="#432954" stroke="#ff72d0" stroke-width="3"/><text x="625" y="238" text-anchor="middle" fill="#e8fbff" font-size="14">existing</text><text x="809" y="238" text-anchor="middle" fill="#ffe1f5" font-size="14">new node</text><text x="712" y="323" text-anchor="middle" fill="#dce6ff" font-size="13">values are applied or copied at spawn time</text></g>
</svg>

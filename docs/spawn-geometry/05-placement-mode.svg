<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Spawn placement modes</title><desc id="desc">Vertex, edge midpoint, and face center anchors on isometric cubes with outward arrows.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#17122b"/></linearGradient><linearGradient id="c" x2="0" y2="1"><stop stop-color="#6ceaff"/><stop offset="1" stop-color="#285ca0"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#ffe08a"/></marker></defs><rect width="960" height="380" rx="22" fill="url(#bg)"/>
  <text x="36" y="44" fill="#f7f5ff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">G cycles the attachment anchor</text><text x="36" y="70" fill="#aab5d6" font-family="system-ui,sans-serif" font-size="14">The yellow point is the anchor; the arrow is its outward direction</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <g transform="translate(43 5)" stroke="#9ff0ff" stroke-width="2"><polygon points="42,180 127,135 207,176 121,224" fill="url(#c)"/><polygon points="42,180 121,224 121,304 42,260" fill="#234e85"/><polygon points="121,224 207,176 207,256 121,304" fill="#173863"/></g><circle cx="250" cy="181" r="8" fill="#ffe08a"/><line x1="250" y1="181" x2="295" y2="134" stroke="#ffe08a" stroke-width="4" marker-end="url(#a)"/><text x="165" y="337" fill="#63e6ff" font-size="18" font-weight="700">VERTEX</text><text x="165" y="358" fill="#aab5d6" font-size="13">corner point</text>
    <g transform="translate(340 5)" stroke="#9ff0ff" stroke-width="2"><polygon points="42,180 127,135 207,176 121,224" fill="url(#c)"/><polygon points="42,180 121,224 121,304 42,260" fill="#234e85"/><polygon points="121,224 207,176 207,256 121,304" fill="#173863"/></g><circle cx="504" cy="160" r="8" fill="#ffe08a"/><line x1="504" y1="160" x2="504" y2="101" stroke="#ffe08a" stroke-width="4" marker-end="url(#a)"/><text x="462" y="337" fill="#ff8bd8" font-size="18" font-weight="700">EDGE</text><text x="462" y="358" fill="#aab5d6" font-size="13">edge midpoint</text>
    <g transform="translate(637 5)" stroke="#9ff0ff" stroke-width="2"><polygon points="42,180 127,135 207,176 121,224" fill="url(#c)"/><polygon points="42,180 121,224 121,304 42,260" fill="#234e85"/><polygon points="121,224 207,176 207,256 121,304" fill="#173863"/></g><circle cx="801" cy="211" r="8" fill="#ffe08a"/><line x1="801" y1="211" x2="874" y2="170" stroke="#ffe08a" stroke-width="4" marker-end="url(#a)"/><text x="759" y="337" fill="#8dffb3" font-size="18" font-weight="700">FACE</text><text x="759" y="358" fill="#aab5d6" font-size="13">face center + normal</text>
  </g><path d="M306 102C335 78 360 78 389 102" fill="none" stroke="#ff72d0" stroke-width="3" stroke-dasharray="6 5"/><path d="M604 102C633 78 658 78 687 102" fill="none" stroke="#ff72d0" stroke-width="3" stroke-dasharray="6 5"/><text x="480" y="104" text-anchor="middle" fill="#ffe1f5" font-family="system-ui,sans-serif" font-size="15">G → G → G → …</text>
</svg>

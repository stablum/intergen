<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Spawn placement modes</title>
  <desc id="desc">Three isometric parent cubes show a vertex anchor, an edge-midpoint anchor, and a face-center anchor, each with its corresponding outward direction.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#17122b"/></linearGradient>
    <linearGradient id="top" x2="0" y2="1"><stop stop-color="#72ecff"/><stop offset="1" stop-color="#3477bb"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#ffe08a"/></marker>
  </defs>
  <rect width="960" height="400" rx="22" fill="url(#bg)"/>
  <text x="36" y="43" fill="#f7f5ff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">G cycles the attachment anchor</text>
  <text x="36" y="69" fill="#aab5d6" font-family="system-ui,sans-serif" font-size="14">Yellow dot = exact anchor · yellow arrow = outward direction used by the spawn frame</text>

  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="180" y="111" fill="#63e6ff" font-size="17" font-weight="700">VERTEX</text>
    <text x="480" y="111" fill="#ff8bd8" font-size="17" font-weight="700">EDGE MIDPOINT</text>
    <text x="780" y="111" fill="#8dffb3" font-size="17" font-weight="700">FACE CENTER</text>
    <text x="330" y="111" fill="#ffe08a" font-size="22">→</text>
    <text x="630" y="111" fill="#ffe08a" font-size="22">→</text>
    <text x="920" y="111" fill="#ffe08a" font-size="22">↻</text>

    <g stroke="#a5f4ff" stroke-width="2">
      <polygon points="100,211 180,169 260,209 180,253" fill="url(#top)"/>
      <polygon points="100,211 180,253 180,329 100,287" fill="#234e85"/>
      <polygon points="180,253 260,209 260,285 180,329" fill="#173863"/>
    </g>
    <circle cx="260" cy="209" r="8" fill="#ffe08a" stroke="#fff3c2" stroke-width="2"/>
    <line x1="260" y1="209" x2="311" y2="163" stroke="#ffe08a" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="180" y="365" fill="#aab5d6" font-size="13">corner point</text>

    <g stroke="#a5f4ff" stroke-width="2">
      <polygon points="400,211 480,169 560,209 480,253" fill="url(#top)"/>
      <polygon points="400,211 480,253 480,329 400,287" fill="#234e85"/>
      <polygon points="480,253 560,209 560,285 480,329" fill="#173863"/>
    </g>
    <circle cx="520" cy="189" r="8" fill="#ffe08a" stroke="#fff3c2" stroke-width="2"/>
    <line x1="520" y1="189" x2="555" y2="128" stroke="#ffe08a" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="480" y="365" fill="#aab5d6" font-size="13">halfway between two vertices</text>

    <g stroke="#a5f4ff" stroke-width="2">
      <polygon points="700,211 780,169 860,209 780,253" fill="url(#top)"/>
      <polygon points="700,211 780,253 780,329 700,287" fill="#234e85"/>
      <polygon points="780,253 860,209 860,285 780,329" fill="#173863"/>
    </g>
    <circle cx="820" cy="269" r="8" fill="#ffe08a" stroke="#fff3c2" stroke-width="2"/>
    <line x1="820" y1="269" x2="895" y2="227" stroke="#ffe08a" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="780" y="365" fill="#aab5d6" font-size="13">center of the visible right face</text>
  </g>
</svg>

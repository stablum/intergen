<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Indexed twist around attachment outward axis</title><desc id="desc">Four children at attachment indices zero through three rotate by multiples of a 36 degree step.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#17122b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#ffe08a"/></marker></defs><rect width="960" height="400" rx="22" fill="url(#bg)"/><text x="36" y="44" fill="#f7f5ff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">[ / ] / T — indexed twist around the outward axis</text><text x="36" y="70" fill="#aab5d6" font-family="system-ui,sans-serif" font-size="14">Example step = 36° · actual angle = attachment index × step</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle"><g fill="#111a31" stroke="#37466d"><rect x="34" y="96" width="210" height="254" rx="15"/><rect x="261" y="96" width="210" height="254" rx="15"/><rect x="488" y="96" width="210" height="254" rx="15"/><rect x="715" y="96" width="210" height="254" rx="15"/></g>
  <g fill="#63e6ff" font-size="14" font-weight="700"><text x="139" y="126">INDEX 0</text><text x="366" y="126">INDEX 1</text><text x="593" y="126">INDEX 2</text><text x="820" y="126">INDEX 3</text></g>
  <g fill="#432954" stroke="#ffb8e7" stroke-width="3"><rect x="92" y="184" width="94" height="94" transform="rotate(0 139 231)"/><rect x="319" y="184" width="94" height="94" transform="rotate(36 366 231)"/><rect x="546" y="184" width="94" height="94" transform="rotate(72 593 231)"/><rect x="773" y="184" width="94" height="94" transform="rotate(108 820 231)"/></g>
  <g fill="none" stroke="#ffe08a" stroke-width="4" marker-end="url(#a)"><path d="M99 292A62 62 0 0 1 185 292"/><path d="M326 292A62 62 0 0 1 412 292"/><path d="M553 292A62 62 0 0 1 639 292"/><path d="M780 292A62 62 0 0 1 866 292"/></g>
  <g fill="#dce6ff" font-size="16" font-weight="700"><text x="139" y="329">0°</text><text x="366" y="329">36°</text><text x="593" y="329">72°</text><text x="820" y="329">108°</text></g></g>

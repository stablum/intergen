<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Generation parameter LFO sampling</title><desc id="desc">A sine LFO adds to a base scale value and fill mode samples successive children at virtual time steps.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#17122b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#ffe08a"/></marker></defs><rect width="960" height="400" rx="22" fill="url(#bg)"/><text x="36" y="44" fill="#f7f5ff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">Generation LFO = base value + time-varying offset</text>
  <g font-family="system-ui,sans-serif"><rect x="35" y="86" width="415" height="272" rx="16" fill="#111a31" stroke="#37466d"/><text x="55" y="117" fill="#63e6ff" font-size="15" font-weight="700">ONE PARAMETER</text><line x1="75" y1="229" x2="407" y2="229" stroke="#5c6b90"/><path d="M75 229C115 135 155 135 195 229S275 323 315 229 375 142 407 205" fill="none" stroke="#ff72d0" stroke-width="4"/><line x1="75" y1="195" x2="407" y2="195" stroke="#63e6ff" stroke-width="3" stroke-dasharray="7 5"/><text x="397" y="187" text-anchor="end" fill="#63e6ff" font-size="12">base</text><circle cx="195" cy="229" r="7" fill="#ffe08a"/><text x="195" y="253" text-anchor="middle" fill="#ffe08a" font-size="12">sample</text><text x="242" y="327" text-anchor="middle" fill="#aab5d6" font-size="13">clamp(base + LFO offset, bounds)</text>
  <path d="M462 221H510" stroke="#ffe08a" stroke-width="4" marker-end="url(#a)"/><rect x="525" y="86" width="400" height="272" rx="16" fill="#111a31" stroke="#37466d"/><text x="545" y="117" fill="#ff8bd8" font-size="15" font-weight="700">FILL MODE: VIRTUAL TIME STEPS</text><line x1="567" y1="185" x2="882" y2="185" stroke="#5c6b90" stroke-width="2"/><g fill="#432954" stroke="#ff72d0" stroke-width="2"><circle cx="592" cy="260" r="25"/><circle cx="666" cy="260" r="37"/><circle cx="757" cy="260" r="47"/><circle cx="854" cy="260" r="34"/></g><g fill="#ffe08a"><circle cx="592" cy="185" r="6"/><circle cx="666" cy="185" r="6"/><circle cx="757" cy="185" r="6"/><circle cx="854" cy="185" r="6"/></g><g fill="#aab5d6" font-size="12" text-anchor="middle"><text x="592" y="163">t</text><text x="666" y="163">t+Δ</text><text x="757" y="163">t+2Δ</text><text x="854" y="163">t+3Δ</text></g><text x="725" y="330" text-anchor="middle" fill="#dce6ff" font-size="13">one Space press · varied children</text></g>
</svg>
